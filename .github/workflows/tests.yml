name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # Los tests cubren la librería de cálculo y los gráficos; no necesitan PyQt6
      - name: Instalar dependencias
        run: pip install "numpy>=1.26" "scipy>=1.12" "matplotlib>=3.8" "plotly>=5.20" "pytest>=8.0"
      - name: Ejecutar tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
